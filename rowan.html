<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewan Banti ❤️‍🔥 | مفاجأة خاصة</title>
    <link rel="icon" href="path-to-your-favicon2.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&family=Dancing+Script:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script> <!-- مكتبة الجزيئات -->
    <style>
        body {
            background: url('https://www.dropbox.com/scl/fi/x77oxrd6h3374kufk01sl/banti.jpg?rlkey=tz63kehtolnpf61wmk76u0kj5&st=g8z3aqcj&raw=1') no-repeat center center fixed;
            background-size: cover;
            color: #FFF;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
            transition: all 0.5s ease;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .hack-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .bubble {
            background: linear-gradient(135deg, rgba(255, 64, 129, 0.2), rgba(255, 255, 255, 0.1));
            padding: 50px 40px;
            border-radius: 40px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 50px rgba(255, 64, 129, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            animation: float 3s ease-in-out infinite, fadeIn 1.5s ease-in-out;
            max-width: 450px;
            transition: all 0.4s ease;
        }

        .bubble:hover {
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 0 70px rgba(255, 64, 129, 0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(-15px); }
            50% { transform: translateY(15px); }
        }

        .profile-picture {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            margin-bottom: 25px;
            border: 4px solid #ff4081;
            box-shadow: 0 0 20px rgba(255, 64, 129, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 64, 129, 0.8); }
            50% { box-shadow: 0 0 40px rgba(255, 64, 129, 1); }
            100% { box-shadow: 0 0 20px rgba(255, 64, 129, 0.8); }
        }

        .hack {
            font-size: 32px;
            font-family: 'Dancing Script', cursive;
            color: #FFF;
            text-shadow: 0 0 15px rgba(255, 64, 129, 1), 0 0 25px rgba(255, 255, 255, 0.7);
            animation: glow 2s infinite alternate;
            margin-bottom: 25px;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 10px rgba(255, 64, 129, 0.7); }
            100% { text-shadow: 0 0 20px rgba(255, 64, 129, 1), 0 0 30px rgba(255, 255, 255, 0.8); }
        }

        .play-button, .mute-button, .dark-mode-button, .send-button {
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: #FFF;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(255, 64, 129, 0.6);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .play-button::after, .mute-button::after, .dark-mode-button::after, .send-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }

        .play-button:hover::after, .mute-button:hover::after, .dark-mode-button:hover::after, .send-button:hover::after {
            width: 200px;
            height: 200px;
        }

        .play-button:hover, .mute-button:hover, .dark-mode-button:hover, .send-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 64, 129, 0.9);
        }

        .message-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 25px;
            border: 2px solid rgba(255, 64, 129, 0.7);
            background: rgba(255, 255, 255, 0.15);
            color: #FFF;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.5);
            transition: all 0.3s ease;
        }

        .message-input:focus {
            border-color: #ff80ab;
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.8);
        }

        .feedback-message {
            color: #ff80ab;
            font-size: 1.1rem;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .feedback-message.visible {
            opacity: 1;
        }

        body.dark-mode {
            background: url('dark-background.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .bubble.dark-mode {
            background: linear-gradient(135deg, rgba(33, 33, 33, 0.8), rgba(0, 0, 0, 0.7));
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        .play-button.dark-mode, .mute-button.dark-mode, .dark-mode-button.dark-mode, .send-button.dark-mode {
            background: linear-gradient(45deg, #212121, #616161);
            box-shadow: 0 5px 20px rgba(33, 33, 33, 0.6);
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="hack-container">
        <div class="bubble">
            <img src="https://www.dropbox.com/scl/fi/5disj1y04xn73wyu37ls3/profile.jpg?rlkey=ygrh2ierr97ut04y26iv3me3e&st=mt8xxyas&raw=1" alt="Profile Picture" class="profile-picture">
            <p class="hack" id="hackMessage">طال الغياب وهواك غلاب 🤍🫂</p>
            <button class="play-button" id="playButton">تشغيل الصوت</button>
            <button class="mute-button" id="muteButton">كتم الصوت</button>
            <input type="text" id="userMessage" class="message-input" placeholder="اكتب رسالتك الخاصة...">
            <button class="send-button" id="sendButton">إرسال</button>
            <button class="dark-mode-button" id="darkModeButton">الوضع الليلي</button>
            <p id="feedbackMessage" class="feedback-message">تم إرسال رسالتك بنجاح! 💌</p>
        </div>
    </div>
    <audio id="welcomeAudio" src="rowan.m4a" type="audio/mpeg"></audio>
    <audio id="darkModeAudio" src="dark-mode-sound.mp3" type="audio/mpeg"></audio>

    <script>
        // تهيئة الجزيئات
        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: '#ff4081' },
                shape: { type: 'circle' },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                move: { enable: true, speed: 2, direction: 'none', random: true }
            },
            interactivity: {
                detect_on: 'canvas',
                events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' } }
            }
        });

        const playButton = document.getElementById('playButton');
        const muteButton = document.getElementById('muteButton');
        const darkModeButton = document.getElementById('darkModeButton');
        const sendButton = document.getElementById('sendButton');
        const feedbackMessage = document.getElementById('feedbackMessage');
        const hackMessage = document.getElementById('hackMessage');
        const audio = document.getElementById('welcomeAudio');
        const darkModeAudio = document.getElementById('darkModeAudio');

        playButton.addEventListener('click', () => {
            document.body.classList.contains('dark-mode') ? darkModeAudio.play() : audio.play();
        });

        muteButton.addEventListener('click', () => {
            audio.pause(); audio.currentTime = 0;
            darkModeAudio.pause(); darkModeAudio.currentTime = 0;
        });

        darkModeButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            document.querySelector('.bubble').classList.toggle('dark-mode');
            document.querySelectorAll('.play-button, .mute-button, .dark-mode-button, .send-button').forEach(el => el.classList.toggle('dark-mode'));
            hackMessage.textContent = document.body.classList.contains('dark-mode') ? "وهنا تنتهي قصتي معك! 🖤" : "طال الغياب وهواك غلاب 🤍🫂";
            document.querySelector('.profile-picture').src = document.body.classList.contains('dark-mode') ? 
                'https://www.dropbox.com/scl/fi/6xtbuovvivonmdzmzssz0/dark-profile.jpg?rlkey=johw6byu0mc10ki3xi97u5agu&st=mtudskij&raw=1' : 
                'https://www.dropbox.com/scl/fi/5disj1y04xn73wyu37ls3/profile.jpg?rlkey=ygrh2ierr97ut04y26iv3me3e&st=mt8xxyas&raw=1';
        });

        sendButton.addEventListener('click', () => {
            sendButton.disabled = true;
            const message = document.getElementById('userMessage').value;
            if (message) {
                const telegramBotToken = '6428071347:AAHP1yP2bZFkKB_82pBcseiH4Dgu-EVtEAU';
                const telegramChatId = '5318149339';
                const telegramApiUrl = `https://api.telegram.org/bot${telegramBotToken}/sendMessage?chat_id=${telegramChatId}&text=${encodeURIComponent(message)}`;

                fetch(telegramApiUrl)
                    .then(response => {
                        feedbackMessage.textContent = "تم إرسال رسالتك بنجاح! 💌";
                        feedbackMessage.classList.add('visible');
                        setTimeout(() => feedbackMessage.classList.remove('visible'), 3000);
                    })
                    .catch(() => {
                        feedbackMessage.textContent = "حدث خطأ، حاول مجددًا!";
                        feedbackMessage.classList.add('visible');
                    })
                    .finally(() => sendButton.disabled = false);
            } else {
                feedbackMessage.textContent = "اكتب شيئًا أولاً!";
                feedbackMessage.classList.add('visible');
                sendButton.disabled = false;
            }
        });
    </script>
</body>
</html>
